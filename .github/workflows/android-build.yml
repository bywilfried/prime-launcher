name: Signed debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.PRIME_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/prime.jks"
      - name: Re-sign debug APK with stable key
        env:
          STORE_PASS: ${{ secrets.PRIME_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PRIME_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.PRIME_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/prime.jks" --ks-pass env:STORE_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out app/build/outputs/apk/debug/prime-launcher-debug-signed.apk app/build/outputs/apk/debug/app-debug.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/prime-launcher-debug-signed.apk
      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: prime-launcher-debug-signed
          path: app/build/outputs/apk/debug/prime-launcher-debug-signed.apk
          if-no-files-found: error
          retention-days: 30
